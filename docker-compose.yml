services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventra
      POSTGRES_PASSWORD: eventra
      POSTGRES_DB: eventra
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventra -d eventra']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  typesense:
    image: typesense/typesense:29.0
    command: >
      --data-dir /data
      --api-key=development-typesense-key
      --enable-cors
    ports:
      - '8108:8108'
    volumes:
      - typesense_data:/data

volumes:
  postgres_data:
  redis_data:
  typesense_data:
